<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>食記護照</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="食記護照">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A28;
    --ink-2:#2A3733;
    --paper:#FBF6EC;
    --paper-dim:#F0E9D8;
    --turmeric:#D9A02D;
    --chili:#C1502E;
    --sage:#6B8F71;
    --line:rgba(251,246,236,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans TC',sans-serif;
    background:var(--ink);
    color:var(--paper);
    min-height:100vh;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  header.hero{
    padding:22px 4px 26px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
    position:relative;
  }
  .login-btn{
    position:absolute;
    top:22px;
    right:4px;
    background:transparent;
    border:1.5px solid var(--line);
    color:rgba(251,246,236,0.75);
    font-size:12px;
    padding:7px 11px;
    border-radius:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .login-btn.logged-in{
    border-color:var(--sage);
    color:var(--sage);
  }
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:24px;
    max-width:320px;
    width:100%;
  }
  .modal-box h3{
    font-family:'Noto Serif TC',serif;
    margin:0 0 14px;
    font-size:18px;
  }
  .modal-box input{margin-bottom:6px;}
  .modal-err{font-size:12px;color:var(--chili);display:none;margin-bottom:8px;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions button{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:none;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .modal-confirm{background:var(--chili);color:#fff;}
  .modal-cancel{background:var(--paper-dim);color:var(--ink-2);}
  .locked-notice{
    text-align:center;
    padding:36px 20px;
    color:var(--ink-2);
  }
  .locked-notice .icon{font-size:32px;margin-bottom:10px;}
  .locked-notice p{font-size:13.5px;line-height:1.7;color:#6B6250;margin:6px 0 16px;}
  .locked-notice button{
    background:var(--chili);
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-size:13.5px;
  }
  .view-only-tag{
    font-size:11px;
    color:var(--turmeric);
    background:rgba(217,160,45,0.12);
    padding:2px 8px;
    border-radius:10px;
    margin-left:6px;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%) translateY(10px);
    background:var(--sage);
    color:#fff;
    padding:11px 20px;
    border-radius:24px;
    font-size:13.5px;
    font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
    opacity:0;
    transition:all .25s ease;
    pointer-events:none;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .eyebrow{
    font-size:12px;
    letter-spacing:0.24em;
    color:var(--turmeric);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:30px;
    margin:0 0 8px;
    letter-spacing:0.02em;
  }
  .sub{
    font-size:13.5px;
    color:rgba(251,246,236,0.62);
    line-height:1.6;
    margin:0;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .tab-btn{
    flex:1;
    padding:12px 10px;
    background:transparent;
    border:1.5px solid var(--line);
    border-radius:10px;
    color:rgba(251,246,236,0.55);
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:all .18s ease;
    letter-spacing:0.04em;
  }
  .tab-btn.active{
    background:var(--turmeric);
    border-color:var(--turmeric);
    color:var(--ink);
  }
  .tab-btn:not(.active):hover{
    border-color:var(--turmeric);
    color:var(--paper);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
  }

  label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-2);
    margin:14px 0 6px;
    letter-spacing:0.02em;
  }
  label:first-child{margin-top:0;}
  select, input[type=text], textarea{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1.5px solid #DCD3BC;
    background:#FFFEFA;
    font-family:'Noto Sans TC',sans-serif;
    font-size:14.5px;
    color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{
    outline:2px solid var(--turmeric);
    outline-offset:1px;
    border-color:var(--turmeric);
  }
  textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row2 > div label{margin-top:14px;}
  .row2 > div:first-child label{margin-top:14px;}

  .file-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    background:var(--paper-dim);
    border:1.5px dashed #C9BB99;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-2);
  }
  .photo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .photo-thumb{
    position:relative;
    width:76px;
    height:76px;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #DCD3BC;
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm{
    position:absolute;
    top:2px;right:2px;
    width:19px;height:19px;
    background:rgba(30,20,10,0.75);
    color:#fff;
    border:none;
    border-radius:50%;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .upload-status{
    font-size:12px;
    color:var(--sage);
    margin-top:6px;
    display:none;
  }

  .submit-btn{
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--chili);
    color:var(--paper);
    border:none;
    border-radius:9px;
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    letter-spacing:0.03em;
  }
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .submit-btn:active{transform:scale(0.99);}
  .status-msg{
    font-size:13px;
    margin-top:10px;
    color:var(--sage);
    display:none;
  }

  .filter-bar{
    display:flex;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .filter-bar select{flex:1;min-width:110px;}

  .entry{
    background:var(--paper);
    color:var(--ink);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .entry-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    cursor:pointer;
  }
  .stamp{
    flex-shrink:0;
    width:46px;
    height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:16px;
    color:#fff;
  }
  .cat-西式{background:#C1502E;}
  .cat-中式{background:#D9A02D;color:var(--ink);}
  .cat-日式{background:#3E7C8C;}
  .cat-港式{background:#B2874B;}
  .cat-韓式{background:#B23A6B;}
  .cat-美式{background:#4C6FA6;}
  .cat-義式{background:#7A9B57;}
  .cat-泰式{background:#6B8F71;}
  .cat-越式{background:#2F6F5E;}
  .cat-素食{background:#4F9D69;}
  .cat-火鍋{background:#A8332B;}
  .cat-燒肉{background:#8C3B2E;}
  .cat-小吃{background:#C97B3D;}
  .cat-宵夜{background:#5B4B8A;}
  .cat-其他{background:#8A7E68;}

  .entry-title{flex:1;min-width:0;}
  .entry-title .name{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:16px;
    margin:0;
  }
  .entry-title .meta{
    font-size:12.5px;
    color:#6B6250;
    margin:2px 0 0;
  }
  .chevron{
    color:#B7AB8E;
    font-size:14px;
    transition:transform .18s ease;
  }
  .entry.open .chevron{transform:rotate(90deg);}

  .entry-body{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid #EDE5D2;
  }
  .entry.open .entry-body{display:block;}
  .entry-body .field{margin-top:12px;}
  .entry-body .field-label{
    font-size:11.5px;
    font-weight:700;
    color:#8A7E68;
    letter-spacing:0.03em;
    margin-bottom:4px;
  }
  .entry-body a{color:var(--chili);word-break:break-all;}
  .entry-body .note{font-size:13.5px;line-height:1.6;color:var(--ink-2);}
  .view-photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .view-photo-grid img{
    width:104px;height:104px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
  }

  .action-row{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .edit-btn, .del-btn{
    flex:1;
    padding:9px 10px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
    font-weight:500;
  }
  .edit-btn{
    background:var(--paper-dim);
    border:1px solid #C9BB99;
    color:var(--ink-2);
  }
  .del-btn{
    background:none;
    border:1px solid #D9C7C7;
    color:var(--chili);
  }

  .edit-form label{margin-top:12px;}
  .edit-actions{display:flex;gap:8px;margin-top:16px;}
  .edit-actions button{
    flex:1;
    padding:10px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    border:none;
  }
  .save-edit-btn{background:var(--sage);color:#fff;}
  .cancel-edit-btn{background:var(--paper-dim);color:var(--ink-2);border:1px solid #C9BB99 !important;}

  .empty{
    text-align:center;
    padding:40px 20px;
    color:rgba(251,246,236,0.5);
    font-size:14px;
    line-height:1.7;
  }
  .loading{text-align:center;padding:30px;color:rgba(251,246,236,0.5);font-size:13px;}
  .count-tag{
    font-size:12px;
    color:rgba(251,246,236,0.5);
    margin-bottom:10px;
  }
  .conn-dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:#888;
    margin-right:5px;
  }
  .conn-dot.on{background:var(--sage);}
  .conn-tag{font-size:11px;color:rgba(251,246,236,0.45);text-align:right;margin-bottom:8px;}
  .update-btn{
    background:none;
    border:none;
    color:var(--turmeric);
    font-size:11px;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <button class="login-btn" id="login-btn">🔒 登入</button>
    <p class="eyebrow">美食共享手帳</p>
    <h1>食記護照</h1>
    <p class="sub">共同紀錄（同步更新），兩人共用同一份美食清單。</p>
  </header>

  <div class="modal-overlay" id="login-modal">
    <div class="modal-box">
      <h3 id="login-modal-title">🔒 輸入密碼</h3>
      <input type="password" id="login-pw-input" placeholder="密碼">
      <p class="modal-err" id="login-err">密碼不正確，請再試一次</p>
      <div class="modal-actions">
        <button class="modal-confirm" id="login-confirm-btn">登入</button>
        <button class="modal-cancel" id="login-cancel-btn">取消</button>
      </div>
    </div>
  </div>

  <p class="conn-tag"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">連線中...</span> · <button id="update-btn" class="update-btn">🔄 檢查更新</button></p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="add">📝 登記</button>
    <button class="tab-btn" data-tab="browse">📖 閱覽</button>
  </div>

  <div class="panel active" id="panel-add">
    <div class="card" id="add-form-card">
      <div class="row2">
        <div>
          <label for="f-county">縣市</label>
          <select id="f-county"></select>
        </div>
        <div>
          <label for="f-district">鄉鎮區</label>
          <select id="f-district"><option value="">請選擇</option></select>
        </div>
      </div>

      <label for="f-category">分類</label>
      <select id="f-category">
        <option value="西式">西式</option>
        <option value="中式">中式</option>
        <option value="日式">日式</option>
        <option value="港式">港式</option>
        <option value="韓式">韓式</option>
        <option value="美式">美式</option>
        <option value="義式">義式</option>
        <option value="泰式">泰式</option>
        <option value="越式">越式</option>
        <option value="素食">素食</option>
        <option value="火鍋">火鍋</option>
        <option value="燒肉">燒肉</option>
        <option value="小吃">小吃</option>
        <option value="宵夜">宵夜</option>
        <option value="其他">其他</option>
      </select>

      <label for="f-revisit">回訪意願</label>
      <select id="f-revisit">
        <option value="😋想回訪">😋想回訪</option>
        <option value="🤔想嘗試">🤔想嘗試</option>
      </select>

      <label for="f-name">美食店名</label>
      <input type="text" id="f-name" placeholder="例如：老王牛肉麵">

      <label for="f-address">地址或地址連結</label>
      <input type="text" id="f-address" placeholder="貼上地址，或 Google 地圖連結">

      <label for="f-phone">聯絡電話</label>
      <input type="text" id="f-phone" placeholder="例如：02-1234-5678">

      <label for="f-note">補充說明</label>
      <textarea id="f-note" placeholder="推薦菜色、心得、價位等..."></textarea>

      <label>照片（可選，可選多張，例如菜單）</label>
      <label class="file-btn" for="f-photo">📷 選擇照片</label>
      <input type="file" id="f-photo" accept="image/*" multiple style="display:none">
      <div class="photo-grid" id="f-photo-grid"></div>
      <p class="upload-status" id="upload-status">上傳中...</p>

      <button class="submit-btn" id="submit-btn">儲存這筆紀錄</button>
      <p class="status-msg" id="status-msg">✓ 已儲存！</p>
    </div>
    <div class="card locked-notice" id="add-locked-notice" style="display:none;">
      <div class="icon">🔒</div>
      <p>目前是瀏覽模式，登入後才能新增紀錄。</p>
      <button id="locked-login-btn">輸入密碼登入</button>
    </div>
  </div>

  <div class="panel" id="panel-browse">
    <div class="filter-bar">
      <select id="filter-county"><option value="">全部縣市</option></select>
      <select id="filter-district"><option value="">全部鄉鎮區</option></select>
      <select id="filter-category">
        <option value="">全部分類</option>
        <option value="西式">西式</option>
        <option value="中式">中式</option>
        <option value="日式">日式</option>
        <option value="港式">港式</option>
        <option value="韓式">韓式</option>
        <option value="美式">美式</option>
        <option value="義式">義式</option>
        <option value="泰式">泰式</option>
        <option value="越式">越式</option>
        <option value="素食">素食</option>
        <option value="火鍋">火鍋</option>
        <option value="燒肉">燒肉</option>
        <option value="小吃">小吃</option>
        <option value="宵夜">宵夜</option>
        <option value="其他">其他</option>
      </select>
      <select id="filter-revisit">
        <option value="">全部回訪意願</option>
        <option value="😋想回訪">😋想回訪</option>
        <option value="🤔想嘗試">🤔想嘗試</option>
      </select>
    </div>
    <p class="count-tag" id="count-tag"></p>
    <div id="entry-list"><div class="loading">讀取中...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

const PASSWORD_HASH = "7d608decaea5ec08bd4141d4d81c51ee8703223bf27bb89239d7e6d9c92493ef";
const AUTH_KEY = 'food-journal-auth';

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function isLoggedIn(){
  return localStorage.getItem(AUTH_KEY) === PASSWORD_HASH;
}

function applyAuthState(){
  const loggedIn = isLoggedIn();
  const btn = document.getElementById('login-btn');
  btn.textContent = loggedIn ? '🔓 已登入' : '🔒 登入';
  btn.classList.toggle('logged-in', loggedIn);

  document.getElementById('add-form-card').style.display = loggedIn ? 'block' : 'none';
  document.getElementById('add-locked-notice').style.display = loggedIn ? 'none' : 'block';

  filterAndRender();
}

}
function closeLoginModal(){
  document.getElementById('login-modal').classList.remove('show');
}

      localStorage.removeItem(AUTH_KEY);
      applyAuthState();
    }
  }else{
    openLoginModal();
  }
});

document.getElementById('login-cancel-btn').addEventListener('click', closeLoginModal);
document.getElementById('login-confirm-btn').addEventListener('click', async ()=>{
  const pw = document.getElementById('login-pw-input').value;
  const hash = await sha256(pw);
  if(hash === PASSWORD_HASH){
    localStorage.setItem(AUTH_KEY, hash);
    closeLoginModal();
    applyAuthState();
  }else{
    document.getElementById('login-err').style.display = 'block';
  }
});

async function uploadOnePhoto(file){
  const compressed = await compressImage(file, 900, 0.7);
  const path = `photos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const ref = storage.ref(path);
  await ref.put(compressed);
  return await ref.getDownloadURL();
}

function compressImage(file, maxW, quality){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(resolve, 'image/jpeg', quality);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

}

function getPhotos(e){
  if(e.photos && Array.isArray(e.photos)) return e.photos;
  if(e.photo) return [e.photo];
  return [];
}

function filterAndRender(){
  const fc = document.getElementById('filter-county').value;
  const fd = document.getElementById('filter-district').value;
  const fcat = document.getElementById('filter-category').value;
  const frev = document.getElementById('filter-revisit').value;

  const list = Object.entries(entries)
    .map(([id, e])=>({id, ...e}))
    .filter(e=> (!fc || e.county === fc) && (!fd || e.district === fd) && (!fcat || e.category === fcat) && (!frev || e.revisit === frev))
    .sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));

  document.getElementById('count-tag').textContent = `共 ${list.length} 筆紀錄`;

  const listEl = document.getElementById('entry-list');
  if(list.length === 0){
    listEl.innerHTML = '<div class="empty">目前沒有符合條件的紀錄<br>去「登記」分頁新增第一筆吧 🍜</div>';
    return;
  }

  listEl.innerHTML = list.map(e=>{
    const isOpen = e.id === openEntryId;
    const isEditing = e.id === editEntryId;
    const photos = getPhotos(e);

    let bodyHtml;
    if(isEditing){
      bodyHtml = renderEditForm(e);
    }else{
      const addressHtml = linkifyAddress(e.address);
      const phoneHtml = e.phone ? `<a href="tel:${escapeAttr(e.phone)}">${escapeHtml(e.phone)}</a>` : '';
      bodyHtml = `
        <div class="field">
          <div class="field-label">地址 / 連結</div>
          <div>${addressHtml}</div>
        </div>
        ${phoneHtml ? `<div class="field"><div class="field-label">聯絡電話</div><div>${phoneHtml}</div></div>` : ''}
        ${e.note ? `<div class="field"><div class="field-label">補充</div><div class="note">${escapeHtml(e.note)}</div></div>` : ''}
        ${photos.length ? `<div class="field"><div class="field-label">照片</div><div class="view-photo-grid">${photos.map(p=>`<img src="${p}" loading="lazy" onclick="window.open('${p}','_blank')">`).join('')}</div></div>` : ''}
        ${isLoggedIn() ? `
        <div class="action-row">
          <button class="edit-btn" onclick="startEdit('${e.id}', event)">✏️ 編輯</button>
          <button class="del-btn" onclick="deleteEntry('${e.id}', event)">🗑 刪除</button>
        </div>` : ''}
      `;
    }

    return `
      <div class="entry ${isOpen?'open':''}" data-id="${e.id}">
        <div class="entry-head" onclick="toggleEntry('${e.id}')">
          <div class="stamp cat-${e.category}">${(e.category||'').slice(0,2)}</div>
          <div class="entry-title">
            <p class="name">${escapeHtml(e.name)}</p>
            <p class="meta">${escapeHtml(e.county||'')}${e.district ? '·'+escapeHtml(e.district) : ''} · ${escapeHtml(e.category||'')}${e.revisit ? ' · '+escapeHtml(e.revisit) : ''}</p>
          </div>
          <span class="chevron">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
  }).join('');
}

const observer = new MutationObserver(()=>{
  document.querySelectorAll('.edit-form').forEach(form=>{
    if(form.dataset.wired) return;
    form.dataset.wired = '1';
    const id = form.dataset.editId;
    const e = { id, ...(entries[id]||{}) };
    e._photos = getPhotos(e).slice();

    function redrawPhotos(){
      renderPhotoGrid_scoped(form.querySelector('.ed-photo-grid'), e._photos, (idx)=>{
        e._photos.splice(idx,1);
        redrawPhotos();
      });
    }
    redrawPhotos();

    const countySel = form.querySelector('.ed-county');
    const districtSel = form.querySelector('.ed-district');
    countySel.addEventListener('change', ()=>{
      const list = COUNTY_DISTRICTS[countySel.value] || [];
      districtSel.innerHTML = '<option value="">請選擇</option>' + list.map(d=>`<option value="${d}">${d}</option>`).join('');
    });

    const addInput = form.querySelector('.ed-photo-add');
    const addLabel = form.querySelector('.ed-photo-add-label');
    addLabel.setAttribute('for', '');
    addLabel.addEventListener('click', ()=> addInput.click());
    addInput.addEventListener('change', async (ev)=>{
      const files = Array.from(ev.target.files || []);
      if(!files.length) return;
      const statusEl = form.querySelector('.ed-upload-status');
      statusEl.style.display = 'block';
      for(let i=0;i<files.length;i++){
        statusEl.textContent = `上傳中... (${i+1}/${files.length})`;
        try{
          const url = await uploadOnePhoto(files[i]);
          e._photos.push(url);
          redrawPhotos();
        }catch(err){ console.error(err); }
      }
      statusEl.textContent = '✓ 上傳完成';
      setTimeout(()=>{ statusEl.style.display='none'; }, 1200);
      ev.target.value = '';
    });

    form._getPhotos = ()=> e._photos;
  });
});
observer.observe(document.getElementById('entry-list'), {childList:true, subtree:true});

function renderPhotoGrid_scoped(el, urls, onRemove){
  el.innerHTML = urls.map((u, idx)=>`
    <div class="photo-thumb">
      <img src="${u}">
      <button class="rm" data-idx="${idx}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=> onRemove(parseInt(btn.dataset.idx)));
  });
}

function toggleEntry(id){
  if(editEntryId === id) return;
  openEntryId = (openEntryId === id) ? null : id;
  filterAndRender();
}

function startEdit(id, evt){
  evt.stopPropagation();
  if(!isLoggedIn()){ openLoginModal(); return; }
  editEntryId = id;
  openEntryId = id;
  filterAndRender();
}

function cancelEdit(evt){
  evt.stopPropagation();
  editEntryId = null;
  filterAndRender();
}

async function saveEdit(id, evt){
  evt.stopPropagation();
  const form = document.querySelector(`.edit-form[data-edit-id="${id}"]`);
  if(!form) return;

  const county = form.querySelector('.ed-county').value;
  const district = form.querySelector('.ed-district').value;
  const category = form.querySelector('.ed-category').value;
  const revisit = form.querySelector('.ed-revisit').value;
  const name = form.querySelector('.ed-name').value.trim();
  const address = form.querySelector('.ed-address').value.trim();
  const phone = form.querySelector('.ed-phone').value.trim();
  const note = form.querySelector('.ed-note').value.trim();
  const photos = form._getPhotos ? form._getPhotos() : [];

  if(!name){
    alert('店名不能空白');
    return;
  }

  try{
    await entriesRef.child(id).update({
      county, district, category, revisit, name, address, phone, note,
      photos: photos.length ? photos : null
    });
    editEntryId = null;
    openEntryId = id;
    filterAndRender();
    showToast('✓ 已儲存修改');
  }catch(err){
    console.error(err);
    alert('儲存失敗，請再試一次：' + err.message);
  }
}

async function deleteEntry(id, evt){
  evt.stopPropagation();
  if(!isLoggedIn()){ openLoginModal(); return; }
  if(!confirm('🔔 確定要刪除這筆紀錄嗎？此動作無法復原。')) return;
  await entriesRef.child(id).remove();
  if(openEntryId === id) openEntryId = null;
  if(editEntryId === id) editEntryId = null;
}

document.getElementById('filter-district').addEventListener('change', filterAndRender);
document.getElementById('filter-category').addEventListener('change', filterAndRender);
document.getElementById('filter-revisit').addEventListener('change', filterAndRender);

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function linkifyAddress(text){
  if(!text) return '（未填寫）';
  const urlRegex = /(https?:\/\/[^\s]+)/gi;
  let result = '';
  let lastIndex = 0;
  let match;
  while((match = urlRegex.exec(text)) !== null){
    result += escapeHtml(text.slice(lastIndex, match.index));
    const url = match[0];
    result += `<a href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`;
    lastIndex = match.index + url.length;
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}

function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>{ t.classList.remove('show'); }, 2200);
}

populateCounties();
applyAuthState();

// --- Service worker: keeps the home-screen app fetching the latest version ---
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=> console.error('SW 註冊失敗', err));
  });
}

document.getElementById('update-btn').addEventListener('click', async ()=>{
  const btn = document.getElementById('update-btn');
  btn.textContent = '更新中...';
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }
  }catch(err){ console.error(err); }
  // 強制重新整理，並加上時間戳記避開任何殘留快取
  location.href = location.pathname + '?t=' + Date.now();
});

// 從背景切回 App 時，自動嘗試靜默更新 Service Worker（不會打斷使用者）
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && 'serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg=> reg && reg.update());
  }
});
</script>
